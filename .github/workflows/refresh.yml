name: refresh-data

on:
  schedule:
    - cron: "0 12 * 9-12,1-2 2"   # Tue 12:00 UTC in season: Sunday + Monday games
    - cron: "0 6 * 9-12,1-2 4"    # Thu 06:00 UTC in season: after Wednesday stat corrections
    - cron: "0 6 1 3-8 *"         # 1st of the month off-season
  workflow_dispatch:
    inputs:
      rebuild_lite:
        description: Rebuild every pbp_lite season
        type: boolean
        default: false
      force:
        description: Re-download every file
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt

      - name: List upstream assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/list_assets.py > assets.json

      - name: Restore previous site
        uses: actions/cache@v4
        with:
          path: site
          key: site-v1-${{ hashFiles('assets.json', 'scripts/pbp_lite_columns.txt', 'scripts/build_pbp_lite.py') }}
          restore-keys: site-v1-

      - name: Sync nflverse data
        run: >
          python scripts/sync.py --dest site --assets assets.json
          ${{ inputs.rebuild_lite && '--rebuild-lite' || '' }}
          ${{ inputs.force && '--force' || '' }}

      - run: python scripts/fetch_logos.py --dest site
      - run: python scripts/build_manifest.py --dest site

      - name: Size guard (Pages limit is 1 GB)
        run: |
          size=$(du -sb site | cut -f1)
          echo "site size: $((size / 1000000)) MB"
          test "$size" -lt 950000000

      - name: Add index page
        run: |
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>nfl-charts-data</title>
          <p>Mirror of <a href="https://github.com/nflverse/nflverse-data">nflverse data</a> (CC BY 4.0) for
          <a href="https://phil-laporte-sh.github.io/nfl-charts/">nfl-charts</a>. See <a href="manifest.json">manifest.json</a>.</p>
          HTML
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Wait for CDN, then smoke test
        run: |
          sleep 30
          python scripts/smoke.py "${{ needs.deploy.outputs.page_url }}"
